<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#888888;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Rocket body -->
    <ellipse cx="100" cy="110" rx="30" ry="60" fill="url(#grad)" />
    <!-- Rocket nose cone -->
    <path d="M 70 110 Q 100 30 130 110" fill="#ffffff" />
    <!-- Rocket window -->
    <circle cx="100" cy="80" r="10" fill="#000000" opacity="0.8" />
    <!-- Fins -->
    <path d="M 70 130 L 50 160 L 70 160 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 130 130 L 150 160 L 130 160 Z" fill="#ffffff" opacity="0.9" />
    <!-- Flames -->
    <path d="M 85 170 Q 100 200 115 170" fill="#ff8800" opacity="0.8" />
    <path d="M 92 170 Q 100 190 108 170" fill="#ffcc00" opacity="0.9" />
</svg>